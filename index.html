<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Учёт аренды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f7);
    --text: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f99);
    --link: var(--tg-theme-link-color, #2f6fde);
    --accent: var(--tg-theme-button-color, #2f6fde);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --ok: #2ea66b; --warn: #e08a1e; --bad: #e0483e;
    --b-confirmed: #5b8def; --b-living: #2ea66b; --b-out: #a3a9b4; --b-debt: #e08a1e;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #17191e; --bg2: #0f1013; --text: #eceef2; --hint: #8b919c; --link: #6d9cff; --accent: #4f86f0;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg2); border: 0;
    border-radius: 10px; padding: 11px 12px; width: 100%; outline: none; }
  textarea { resize: vertical; min-height: 64px; }
  a { color: var(--link); text-decoration: none; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg2); padding: 12px 16px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .pill { font-size: 12px; color: var(--hint); background: var(--bg); padding: 4px 10px; border-radius: 99px; }
  .demo { font-size: 12px; background: var(--bg); border-radius: 99px; padding: 4px 8px; width: auto; }

  main { padding: 0 16px; }
  .view { display: none; } .view.on { display: block; }
  .card { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--hint);
    margin: 18px 4px 8px; display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--hint); font-size: 13px; }
  .strong { font-weight: 600; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--sep); }
  .list .item:first-child { border-top: 0; padding-top: 2px; }
  .list .item:last-child { padding-bottom: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bg2); color: var(--hint); white-space: nowrap; }
  .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .tag.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .empty { color: var(--hint); text-align: center; padding: 14px 0; font-size: 14px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: var(--radius); padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-weight: 700; }
  .stat span { font-size: 12px; color: var(--hint); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpis .stat b { font-size: 19px; }

  .btn { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 12px 16px;
    font-weight: 600; width: 100%; }
  .btn.sm { width: auto; padding: 7px 12px; font-size: 14px; border-radius: 10px; }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .btn:disabled { opacity: .5; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

  /* Шахматка */
  .chess { background: var(--bg); border-radius: var(--radius); overflow-x: auto; position: relative;
    -webkit-overflow-scrolling: touch; }
  .chess table { border-collapse: separate; border-spacing: 0; }
  .chess th, .chess td { padding: 0; height: 44px; }
  .chess .name { position: sticky; left: 0; z-index: 2; background: var(--bg); min-width: 104px; max-width: 104px;
    padding: 0 8px 0 12px; font-size: 13px; font-weight: 600; border-right: 1px solid var(--sep);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .chess thead th { height: 40px; font-size: 11px; color: var(--hint); font-weight: 500; position: sticky; top: 0; }
  .chess thead th.day { min-width: 40px; text-align: center; line-height: 1.15; }
  .chess thead th.day b { display: block; font-size: 14px; color: var(--text); }
  .chess .we b { color: var(--bad) !important; }
  .chess .today b { color: var(--accent) !important; }
  .chess .track { position: relative; border-top: 1px solid var(--sep); }
  .chess .track .cols { position: absolute; inset: 0; display: flex; }
  .chess .track .cols i { flex: none; width: 40px; border-left: 1px solid var(--sep); }
  .chess .track .cols i.today { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .chess .bar { position: absolute; top: 7px; height: 30px; border-radius: 8px; color: #fff; font-size: 12px;
    font-weight: 600; padding: 0 7px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 4px; font-size: 12px; color: var(--hint); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* Финансы */
  .month { display: flex; align-items: center; justify-content: space-between; background: var(--bg);
    border-radius: var(--radius); padding: 6px; margin-bottom: 10px; }
  .month button { width: 40px; height: 36px; border-radius: 10px; font-size: 20px; }
  .month b { font-size: 16px; text-transform: capitalize; }
  .occ { height: 5px; background: var(--bg2); border-radius: 9px; overflow: hidden; margin-top: 5px; }
  .occ i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
  .num { text-align: right; white-space: nowrap; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    border-top: 1px solid var(--sep); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 11px; color: var(--hint); padding: 4px 0; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--accent); }
  .fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 6;
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.18); }

  /* Шторка */
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; opacity: 0;
    pointer-events: none; transition: opacity .2s; }
  .shade.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--bg);
    border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto; transform: translateY(100%);
    transition: transform .25s ease; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet.on { transform: none; }
  .sheet .grab { width: 38px; height: 5px; border-radius: 9px; background: var(--sep); margin: 0 auto 10px; }
  .sheet h2 { margin: 2px 0 12px; font-size: 19px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: var(--hint); margin: 0 0 4px 2px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--sep); gap: 12px; }
  .kv:first-of-type { border-top: 0; }
  .kv span:first-child { color: var(--hint); }
  .note { font-size: 13px; padding: 9px 11px; border-radius: 10px; margin-bottom: 10px; }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .note.info { background: var(--bg2); color: var(--hint); white-space: pre-wrap; }

  .access { background: var(--bg2); border-radius: 12px; padding: 4px 12px; margin-bottom: 10px; }
  .access .kv { border-color: color-mix(in srgb, var(--hint) 18%, transparent); cursor: pointer; }
  .code { font: 600 17px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
  .script { background: var(--bg2); border-radius: 12px; padding: 10px 12px; font-size: 14px;
    white-space: pre-wrap; margin: 8px 0 10px; }
  details summary { color: var(--link); font-size: 14px; cursor: pointer; padding: 4px 2px; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px); z-index: 20;
    background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    transition: transform .25s; max-width: calc(100% - 32px); }
  .toast.on { transform: translate(-50%, 0); }
  .toast.err { background: var(--bad); }
  .loading { text-align: center; color: var(--hint); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Сегодня</h1>
  <div class="row">
    <select id="demoRole" class="demo" hidden aria-label="Роль в демо"></select>
    <span class="pill" id="who"></span>
  </div>
</header>

<main>
  <div class="loading" id="loading">Загрузка…</div>
  <section class="view" id="v-today"></section>
  <section class="view" id="v-chess"></section>
  <section class="view" id="v-clean"></section>
  <section class="view" id="v-fin"></section>
</main>

<button class="fab" id="fab" hidden aria-label="Добавить">+</button>

<nav id="nav">
  <button data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
  <button data-v="chess"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h5M10 17h7"/></svg>Шахматка</button>
  <button data-v="clean"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3l-4 9M6 12h10l2 9H4z"/><path d="M9 17v4M13 17v4"/></svg>Уборки</button>
  <button data-v="fin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Финансы</button>
</nav>

<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
// Адрес веб-приложения Apps Script (Развернуть → Веб-приложение → URL).
// Если оставить пустым — приложение работает в демо-режиме на тестовых данных.
const API_URL = 'https://script.google.com/macros/s/AKfycbzTmJUOB5cL8VdhtPBrd73yUF7M-6TxZxlvJCugS8xnpsMtgDAYb2zS0pLgcn_GoVO4VQ/exec';

const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (tg) { document.documentElement.classList.add('tg'); tg.ready(); tg.expand(); }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ------------------------------------------------------------ даты и форматирование
const D = {
  parse: s => new Date(s + 'T12:00:00Z'),
  fmt: d => d.toISOString().slice(0, 10),
  add: (s, n) => { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.fmt(d); },
  addM: (s, n) => { const d = D.parse(s); d.setUTCMonth(d.getUTCMonth() + n); return D.fmt(d); },
  diff: (a, b) => Math.round((D.parse(b) - D.parse(a)) / 864e5),
  short: s => s.slice(8, 10) + '.' + s.slice(5, 7),
  dow: s => ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'][D.parse(s).getUTCDay()],
  human(s, today) {
    const n = D.diff(today, s);
    if (n === 0) return 'сегодня'; if (n === 1) return 'завтра'; if (n === -1) return 'вчера';
    return D.dow(s) + ', ' + D.short(s);
  },
  monthName: ym => ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь',
    'октябрь', 'ноябрь', 'декабрь'][+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4),
};
const money = n => Math.round(n || 0).toLocaleString('ru-RU') + ' ₽';
const pct = x => Math.round((x || 0) * 100) + '%';
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); };

// ------------------------------------------------------------ API
async function api(action, data) {
  if (!API_URL) return Mock.call(action, data || {});
  // text/plain без заголовков — «простой» запрос, Apps Script не нужен CORS-preflight
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data, initData: tg ? tg.initData : '' }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// ------------------------------------------------------------ состояние
const S = { data: null, view: 'today', month: null, report: null };
const ROLE = { OWNER: 'Управляющий', ADMIN: 'Администратор', CLEANER: 'Уборщица' };
const isCleaner = () => S.data.user.role === ROLE.CLEANER;
const isOwner = () => S.data.user.role === ROLE.OWNER;
const apt = id => S.data.apartments.find(a => a.id === String(id)) || { name: '—', id };
const live = () => (S.data.bookings || []).filter(b => b.status !== 'Отменена');
const debtOf = b => Math.max(0, (+b.amount || 0) - (+b.paid || 0));
const STATUS_COLOR = { 'Подтверждена': 'var(--b-confirmed)', 'Заселены': 'var(--b-living)', 'Выехали': 'var(--b-out)' };

async function load() {
  try {
    S.data = await api('bootstrap');
    S.month = S.month || S.data.today.slice(0, 7);
    $('#loading').hidden = true;
    $('#who').textContent = S.data.user.name;
    $('#who').hidden = !API_URL;
    if (isCleaner()) { [...$('#nav').children].forEach(b => b.hidden = b.dataset.v !== 'clean'); S.view = 'clean'; }
    else [...$('#nav').children].forEach(b => b.hidden = false);
    show(S.view);
  } catch (e) {
    $('#loading').innerHTML = '⚠️ ' + esc(e.message);
  }
}

function show(v) {
  S.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'v-' + v));
  [...$('#nav').children].forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#title').textContent = { today: 'Сегодня', chess: 'Шахматка', clean: 'Уборки', fin: 'Финансы' }[v];
  $('#fab').hidden = isCleaner() || v === 'clean';
  ({ today: renderToday, chess: renderChess, clean: renderClean, fin: renderFin })[v]();
}
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) { haptic(); show(b.dataset.v); } };
$('#fab').onclick = () => S.view === 'fin' ? expenseForm() : bookingForm();

// ------------------------------------------------------------ Сегодня
function renderToday() {
  const t = S.data.today, bs = live();
  const ins = bs.filter(b => b.checkin === t), outs = bs.filter(b => b.checkout === t);
  const living = bs.filter(b => b.checkin <= t && b.checkout > t);
  const busy = new Set(living.map(b => b.apartmentId));
  const free = S.data.apartments.filter(a => !busy.has(a.id));
  const tomorrow = bs.filter(b => b.checkin === D.add(t, 1));
  const unpaid = bs.filter(b => debtOf(b) > 0 && b.checkin >= t && b.checkin <= D.add(t, 3))
    .sort((a, b) => a.checkin.localeCompare(b.checkin));
  const cl = S.data.cleanings.filter(c => c.date === t);

  const bItem = (b, extra) => `<div class="item" onclick="bookingCard('${b.id}')">
      <span class="dot" style="background:${STATUS_COLOR[b.status] || 'var(--hint)'}"></span>
      <div class="grow"><div class="strong ell">${esc(apt(b.apartmentId).name)}</div>
      <div class="muted ell">${esc(b.guest || 'гость')} · ${plural(b.nights || D.diff(b.checkin, b.checkout), 'ночь', 'ночи', 'ночей')}</div></div>
      ${extra || ''}</div>`;
  const debtTag = b => debtOf(b) ? `<span class="tag warn">долг ${money(debtOf(b))}</span>` : '<span class="tag ok">оплачено</span>';

  $('#v-today').innerHTML = `
    <div class="muted" style="margin:0 4px 10px">${D.dow(t)}, ${D.short(t)}.${t.slice(0, 4)}</div>
    <div class="stats">
      <div class="stat"><b>${living.length}<small style="font-size:14px;color:var(--hint)">/${S.data.apartments.length}</small></b><span>занято</span></div>
      <div class="stat"><b>${ins.length}</b><span>заезды</span></div>
      <div class="stat"><b>${outs.length}</b><span>выезды</span></div>
    </div>
    ${unpaid.length ? `<div class="sec">⚠️ Ждём оплату</div><div class="card list">${unpaid.map(b => bItem(b,
      `<div class="num"><div class="tag warn">${money(debtOf(b))}</div><div class="muted">${D.human(b.checkin, t)}</div></div>`)).join('')}</div>` : ''}
    <div class="sec">Выезды</div>
    <div class="card list">${outs.map(b => bItem(b, (() => { const c = cl.find(c => c.bookingId === b.id);
      return c ? `<span class="tag ${c.status === 'Готово' ? 'ok' : ''}">${c.status === 'Готово' ? 'убрано' : 'уборка'}</span>` : ''; })())).join('') || '<div class="empty">Нет выездов</div>'}</div>
    <div class="sec">Заезды</div>
    <div class="card list">${ins.map(b => bItem(b, debtTag(b))).join('') || '<div class="empty">Нет заездов</div>'}</div>
    <div class="sec"><span>Свободно сегодня</span><span>${free.length}</span></div>
    <div class="card list">${free.map(a => `<div class="item" onclick="bookingForm({apartmentId:'${a.id}',checkin:'${t}'})">
      <div class="grow strong ell">${esc(a.name)}</div><span class="muted">${money(a.price)}</span>
      <span class="tag">+ бронь</span></div>`).join('') || '<div class="empty">Всё занято 🎉</div>'}</div>
    <div class="sec">Завтра заезды</div>
    <div class="card list">${tomorrow.map(b => bItem(b, debtTag(b))).join('') || '<div class="empty">Нет</div>'}</div>`;
}

// ------------------------------------------------------------ Шахматка
const CW = 40;
function renderChess() {
  const t = S.data.today, start = D.add(t, -3), days = 31;
  const dates = Array.from({ length: days }, (_, i) => D.add(start, i));
  const head = dates.map(d => {
    const wd = D.parse(d).getUTCDay();
    return `<th class="day ${wd === 0 || wd === 6 ? 'we' : ''} ${d === t ? 'today' : ''}">${D.dow(d)}<b>${+d.slice(8)}</b></th>`;
  }).join('');
  const cols = dates.map(d => `<i class="${d === t ? 'today' : ''}"></i>`).join('');
  const end = D.add(start, days);
  const rows = S.data.apartments.map(a => {
    const bars = live().filter(b => b.apartmentId === a.id && b.checkout > start && b.checkin < end).map(b => {
      // бронь рисуется от середины дня заезда до середины дня выезда — как в отельной шахматке
      const l = Math.max(D.diff(start, b.checkin) * CW + CW / 2, 0);
      const r = Math.min(D.diff(start, b.checkout) * CW + CW / 2, days * CW);
      const color = debtOf(b) && b.status === 'Подтверждена' ? 'var(--b-debt)' : STATUS_COLOR[b.status];
      return `<div class="bar" style="left:${l + 1}px;width:${r - l - 2}px;background:${color}"
        onclick="event.stopPropagation();bookingCard('${b.id}')">${esc(b.guest || '')}</div>`;
    }).join('');
    return `<tr><th class="name" title="${esc(a.name)}">${esc(a.name)}</th>
      <td colspan="${days}" class="track" style="width:${days * CW}px" onclick="chessTap(event,'${a.id}','${start}')">
      <div class="cols">${cols}</div>${bars}</td></tr>`;
  }).join('');
  $('#v-chess').innerHTML = `<div class="chess" id="chessBox"><table>
      <thead><tr><th class="name"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>

// Подстановки в тексте инструкции: {гость} {адрес} {заезд} {выезд} {сейф} {wifi} {пароль}
function fillCheckin(a, b) {
  const longDate = s => s ? +s.slice(8) + ' ' + ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля',
    'августа', 'сентября', 'октября', 'ноября', 'декабря'][+s.slice(5, 7) - 1] : '';
  // Без брони (карточка уборки) даты и имя показываем заглушками
  const vars = { 'гость': b ? b.guest || '' : '[имя]', 'адрес': a.address || a.name,
    'заезд': b ? longDate(b.checkin) : '[дата заезда]', 'выезд': b ? longDate(b.checkout) : '[дата выезда]',
    'сейф': a.safeCode || '', 'wifi': a.wifiName || '', 'пароль': a.wifiPass || '' };
  return String(a.checkinInfo || '').replace(/\{([^}]+)\}/g, (m, k) => k in vars ? vars[k] : m)
    .replace(/,\s*!/g, '!').trim();
}
function accessBlock(a) {
  const row = (label, val, cls) => val ? `<div class="kv" onclick="copyText('${esc(String(val)).replace(/'/g, "\\'")}', '${label} скопирован')">
    <span>${label}</span><span class="${cls || ''}">${esc(val)}</span></div>` : '';
  const html = row('Код сейфа', a.safeCode, 'code') + row('Wi-Fi', a.wifiName) + row('Пароль Wi-Fi', a.wifiPass, 'code');
  return html ? `<div class="access">${html}</div>` : '';
}
function copyCheckin(id) {
  const b = S.data.bookings.find(x => x.id === id);
  copyText(fillCheckin(apt(b.apartmentId), b), 'Инструкция скопирована — вставьте в чат Авито');
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  haptic('success'); toast(msg || 'Скопировано');
}

      d = D.add(d, Math.floor(rnd() * (weak ? 6 : future ? 4 : 2.4)));
      const n = 1 + Math.floor(rnd() * (rnd() < .2 ? 7 : 3));
      const co = D.add(d, n);
      const status = co <= today ? 'Выехали' : d <= today ? 'Заселены' : 'Подтверждена';
      const amount = n * a.price - (n >= 5 ? 1000 : 0);
      const paid = status === 'Подтверждена' && rnd() < .35 ? Math.round(amount * .3 / 100) * 100 : amount;
      const b = { id: 'B' + id++, created: D.add(d, -Math.floor(rnd() * 10) - 1), apartmentId: a.id, checkin: d, checkout: co,
        nights: n, guest: pickR(guests), phone: '+7 9' + Math.floor(1e8 + rnd() * 9e8), guests: 1 + Math.floor(rnd() * 3),
        amount, paid, status, comment: rnd() < .1 ? 'Ранний заезд в 11:00' : '', author: 'Катя' };
      db.bookings.push(b);
      db.cleanings.push({ id: 'C' + b.id, date: co, apartmentId: a.id, bookingId: b.id, status: co < today || (co === today && rnd() < .4) ? 'Готово' : 'Запланирована',
        cleaner: co <= today ? 'Катя' : '', fee: a.cleaningFee, comment: '' });
      d = co;
    }
  });
  const cats = ['Химия и расходники', 'Бельё и стирка', 'Ремонт', 'Коммуналка', 'Прочее'];
  for (let i = 0; i < 26; i++) {
    const c = pickR(cats);
    db.expenses.push({ id: 'E' + i, date: D.add(today, -Math.floor(rnd() * 70)), apartmentId: c === 'Химия и расходники' && rnd() < .5 ? '' : pickR(db.apartments).id,
      category: c, amount: c === 'Коммуналка' ? 3500 + Math.round(rnd() * 20) * 100 : 300 + Math.round(rnd() * 40) * 100, comment: '', author: 'Катя' });
  }
  let role = 'Управляющий';
  const sel = $('#demoRole');
  sel.hidden = false;
  sel.innerHTML = ['Управляющий', 'Администратор', 'Уборщица'].map(r => `<option>${r}</option>`).join('');
  sel.onchange = () => { role = sel.value; S.view = role === 'Уборщица' ? 'clean' : 'today'; load(); };

  const clash = b => db.bookings.find(x => x.id !== b.id && x.apartmentId === b.apartmentId && x.status !== 'Отменена' && b.checkin < x.checkout && b.checkout > x.checkin);
  const validate = b => {
    if (!b.apartmentId || !b.checkin || !b.checkout) throw new Error('Заполните квартиру и даты');
    if (b.checkout <= b.checkin) throw new Error('Выезд должен быть позже заезда');
    const c = clash(b); if (c) throw new Error(`Даты пересекаются с бронью ${c.guest} (${D.short(c.checkin)}–${D.short(c.checkout)})`);
  };
  const clone = o => JSON.parse(JSON.stringify(o));
  const user = () => ({ id: '1', name: role === 'Управляющий' ? 'Алексей' : 'Катя', role });

  function report(month) {
    const start = month + '-01', end = D.addM(start, 1), days = D.diff(start, end);
    const by = {}; db.apartments.forEach(a => by[a.id] = { id: a.id, name: a.name, nights: 0, revenue: 0, cleaning: 0, expenses: 0 });
    let general = 0;
    db.bookings.forEach(b => {
      if (b.status === 'Отменена') return;
      const n = D.diff(b.checkin, b.checkout);
      const k = D.diff(b.checkin > start ? b.checkin : start, b.checkout < end ? b.checkout : end);
      if (n > 0 && k > 0) { by[b.apartmentId].nights += k; by[b.apartmentId].revenue += b.amount * k / n; }
    });
    db.cleanings.forEach(c => { if (c.status === 'Готово' && c.date >= start && c.date < end) by[c.apartmentId].cleaning += c.fee; });
    db.expenses.forEach(x => { if (x.date >= start && x.date < end) { if (by[x.apartmentId]) by[x.apartmentId].expenses += x.amount; else general += x.amount; } });
    const rows = Object.values(by).map(r => Object.assign(r, { revenue: Math.round(r.revenue), occupancy: r.nights / days,
      adr: r.nights ? Math.round(r.revenue / r.nights) : 0 })).map(r => Object.assign(r, { profit: r.revenue - r.cleaning - r.expenses }))
      .sort((a, b) => b.revenue - a.revenue);
    const s = f => rows.reduce((t, r) => t + r[f], 0);
    const T = { revenue: s('revenue'), nights: s('nights'), cleaning: s('cleaning'), expenses: s('expenses') + general, generalExpenses: general };
    T.profit = T.revenue - T.cleaning - T.expenses; T.occupancy = T.nights / (rows.length * days); T.adr = T.nights ? Math.round(T.revenue / T.nights) : 0;
    const debts = db.bookings.filter(b => b.status !== 'Отменена' && b.paid < b.amount && b.checkin >= start && b.checkin < end)
      .map(b => ({ id: b.id, apartmentId: b.apartmentId, guest: b.guest, checkin: b.checkin, debt: b.amount - b.paid }));
    return { month, days, rows, totals: T, debts };
  }

  async function call(action, d) {
    await new Promise(r => setTimeout(r, 150));
    const staff = role !== 'Уборщица';
    if (/Booking|Expense/.test(action) && !staff) throw new Error('Недостаточно прав');
    switch (action) {
      case 'bootstrap': {
        const from = D.add(today, -45);
        const out = { user: user(), today, statuses: [], categories: ['Коммуналка', 'Интернет', 'Химия и расходники', 'Бельё и стирка', 'Ремонт', 'Мебель и техника', 'Комиссия Авито', 'Продвижение', 'Зарплата', 'Прочее'],
          apartments: clone(db.apartments),
          cleanings: clone(db.cleanings.filter(c => c.date >= D.add(today, -7) && c.status !== 'Отменена')) };
        if (staff) { out.bookings = clone(db.bookings.filter(b => b.checkout >= from)); out.expenses = clone(db.expenses.filter(x => x.date >= from)); }
        return out;
      }
      case 'addBooking': {
        validate(d);
        const a = db.apartments.find(x => x.id === d.apartmentId);
        const b = Object.assign({ id: 'B' + id++, created: today, status: 'Подтверждена', author: user().name }, d, { nights: D.diff(d.checkin, d.checkout) });
        db.bookings.push(b);
        db.cleanings.push({ id: 'C' + b.id, date: b.checkout, apartmentId: b.apartmentId, bookingId: b.id, status: 'Запланирована', cleaner: '', fee: a.cleaningFee, comment: '' });
        return b;
      }
      case 'updateBooking': {
        const b = db.bookings.find(x => x.id === d.id);
        const next = Object.assign({}, b, d);
        if (next.status !== 'Отменена') validate(next);
        next.nights = D.diff(next.checkin, next.checkout);
        Object.assign(b, next);
        const c = db.cleanings.find(x => x.bookingId === b.id);
        if (c && c.status !== 'Готово') Object.assign(c, { date: b.checkout, status: b.status === 'Отменена' ? 'Отменена' : 'Запланирована' });
        return b;
      }
      case 'cleaningDone': {
        const c = db.cleanings.find(x => x.id === d.id);
        return Object.assign(c, { status: 'Готово', cleaner: user().name, comment: d.comment || c.comment, doneAt: today });
      }
      case 'addExpense': {
        if (!(d.amount > 0)) throw new Error('Укажите сумму');
        const x = Object.assign({ id: 'E' + id++, author: user().name }, d);
        db.expenses.push(x); return x;
      }
      case 'report':
        if (role !== 'Управляющий') throw new Error('Недостаточно прав');
        return report(d.month || today.slice(0, 7));
    }
    throw new Error('Неизвестное действие: ' + action);
  }
  return { call };
})();

load();
</script>
</body>
</html>
